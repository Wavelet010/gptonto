<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GPTOnto</title>
<style>
:root{font-family:system-ui,sans-serif;color:#172636;background:#f4f6fa}body{margin:0}header{background:#19374b;color:white;padding:22px 5%;display:flex;gap:20px;align-items:center;flex-wrap:wrap}header h1{margin:0;font-size:24px}header input{margin-left:auto}main{max-width:1180px;margin:auto;padding:24px}nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}section{background:white;padding:22px;border:1px solid #d8e0e8;border-radius:10px;margin-bottom:15px}section[hidden]{display:none}h2{margin-top:0}button,input,select{font:inherit;border:1px solid #b6c2cc;border-radius:5px;padding:8px;max-width:100%}button{cursor:pointer;background:white}button.primary,button.active{background:#146c75;color:white;border-color:#146c75}button:disabled{opacity:.5;cursor:default}form{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:18px}label{display:flex;align-items:center;gap:5px}table{width:100%;border-collapse:collapse;table-layout:auto}th,td{text-align:left;padding:9px;border-bottom:1px solid #e1e7ed;overflow-wrap:anywhere}small{color:#5a6a78}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f4f6fa;padding:12px;border-radius:6px;max-height:400px;overflow:auto}#message{white-space:pre-wrap;min-height:24px;margin-bottom:12px;color:#9f2929}.panel{overflow:auto}details{margin:10px 0}summary{cursor:pointer;font-weight:600}svg{width:100%;height:auto;min-height:250px;border:1px solid #e0e5e9;border-radius:5px}svg text{font-size:11px}#graphinfo{max-height:260px}#detail{margin-top:15px}nav button{flex:1}
</style></head><body><header><h1>GPTOnto</h1><span>多本体驱动知识抽取</span><input id="key" type="password" placeholder="服务 API Key（如启用）"><button id="refresh">刷新</button></header><main>
<nav id="tabs"></nav><div id="message" role="status"></div>
<section id="ontologies"><h2>本体管理</h2><form id="ontologyform"><input name="name" placeholder="本体名称" required><input type="file" name="file" accept=".ttl" required><label>依赖已上传本体<select id="dependencies" multiple size="3"></select></label><button class="primary">上传 TTL</button></form><div class="panel" id="ontologylist"></div></section>
<section id="prompts" hidden><h2>提示词管理</h2><form id="promptform"><input name="name" placeholder="提示词名称" required><input type="file" name="file" accept=".yaml,.yml" required><button class="primary">上传 YAML</button></form><div class="panel" id="promptlist"></div></section>
<section id="profiles" hidden><h2>抽取方案</h2><form id="profileform"><input name="name" placeholder="方案名称" required><select name="ontology_id" required></select><select name="prompt_id" required></select><button class="primary">绑定本体与提示词</button></form><div class="panel" id="profilelist"></div></section>
<section id="documents" hidden><h2>文档管理</h2><form id="documentform"><input name="file" type="file" accept=".txt,.docx,.doc,.md,.pdf,.pptx,.ppt,.xlsx,.xls,.csv,.json,.html,.xml,.png,.jpg,.jpeg,.tiff,.webp" required><label>文档解析<select name="parser"><option value="auto">自动（原生/基础）</option><option value="native">原生 DOCX / Markdown</option><option value="legacy">基础文本解析</option><option value="mineru">MinerU（需配置）</option><option value="docling">Docling（需配置）</option></select></label><label><input type="checkbox" name="cross_chunk" checked>跨块关系补全</label><label>分块模式<select name="strategy"><option value="H">H 编号标题</option><option value="F">F 固定 Token</option><option value="R">R 递归字符</option><option value="P">P 段落语义</option><option value="V">V 语义向量</option><option value="S">S 结构感知</option></select></label><label>块大小<input name="size" type="number" min="64" max="16000" value="2000" required></label><label>重叠<input name="overlap" type="number" min="0" value="100" required></label><label>H 标题深度<input name="heading_depth" type="number" min="1" max="6" value="1" required></label><label>数字标题层级<select name="number_base"><option value="">自动</option><option value="1">一级</option><option value="2">二级</option><option value="3">三级</option></select></label><label>H 标题格式<select id="headingformats" multiple size="3"><option value="chinese" selected>一、二、三</option><option value="number" selected>1. / 1。</option><option value="bracket_cn" selected>（一）</option><option value="bracket_num" selected>（1）</option><option value="chapter" selected>第一章</option><option value="markdown" selected>Markdown</option></select></label><label>限定抽取方案<select id="docprofiles" multiple size="3"></select></label><button type="button" id="preview">分块预览</button><button class="primary">上传并抽取</button></form><p><small>未选择方案时使用全部启用方案；H 模式严格按选定标题层级和格式划分。V 模式需配置 Embedding。</small></p><div class="panel" id="documentlist"></div><div id="detail"></div></section>
<section id="graph" hidden><h2>知识实例及图谱</h2><p><a href="graph-ui/" target="_blank" rel="noopener">打开原版 LightRAG 高级图谱（需构建前端资源）</a></p><form id="graphform"><label>文档<select name="document_id"><option value="">全部</option></select></label><label>搜索<input name="q" placeholder="名称、编号、属性"></label><label>类型<select name="class_uri"><option value="">全部</option></select></label><button type="submit">查询</button><button type="button" id="clearfocus">取消邻域</button><button type="button" id="export">导出 JSON</button><button type="button" id="exportttl">导出 TTL</button></form><p id="graphcount"></p><div><button id="prevpage">上一页</button> <button id="nextpage">下一页</button> <button id="resetview">重置视图</button> <small>滚轮缩放，拖动空白平移；双击节点展开邻域。</small></div><div id="graphview"></div><pre id="graphinfo">点击图谱节点查看属性与证据。</pre><div class="panel" id="entitylist"></div><div class="panel" id="relationlist"></div></section>
</main><script>
const $=id=>document.getElementById(id), el=(tag,value)=>{const n=document.createElement(tag);if(value!==undefined)n.textContent=String(value);return n;};
const msg=x=>$('message').textContent=x||'';
const jbody=x=>({method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(x)});
async function api(path,options={}){const headers=new Headers(options.headers||{});if($('key').value)headers.set('Authorization','Bearer '+$('key').value);const r=await fetch('ontology-api'+path,{...options,headers});if(!r.ok)throw Error((await r.text()).slice(0,1000));return r.json();}
const action=fn=>async e=>{if(e)e.preventDefault();try{msg('');await fn(e)}catch(x){msg(x.message)}};
function button(text,fn){const b=el('button',text);b.type='button';b.onclick=action(fn);return b;}
function details(value,label='详情'){const d=el('details');d.append(el('summary',label),el('pre',JSON.stringify(value,null,2)));return d;}
function table(target,heads,rows){const t=el('table'),tr=el('tr');heads.forEach(x=>tr.append(el('th',x)));t.append(tr);for(const row of rows){const r=el('tr');for(const v of row){const cell=el('td');if(v instanceof Node)cell.append(v);else cell.textContent=v??'';r.append(cell)}t.append(r)}$(target).replaceChildren(t);}
function selectOptions(s,items,empty){const old=new Set([...s.selectedOptions].map(o=>o.value));s.replaceChildren();if(empty!==undefined){const o=el('option',empty);o.value='';s.append(o)}for(const a of items){const o=el('option',a.name||a.filename);o.value=a.id;s.append(o)}if(s.multiple){for(const o of s.options)o.selected=old.has(o.value)}else if([...s.options].some(o=>old.has(o.value)))s.value=[...old][0];}
const names={ontologies:'本体管理',prompts:'提示词管理',profiles:'抽取方案',documents:'文档 / 抽取结果',graph:'实例 / 图谱'};
let current='ontologies';
for(const [id,name] of Object.entries(names)){const b=button(name,async()=>{current=id;for(const k of Object.keys(names))$(k).hidden=k!==id;for(const x of $('tabs').children)x.classList.toggle('active',x===b);await refresh()});if(id===current)b.classList.add('active');$('tabs').append(b)}
async function enable(path,item){await api(path+'/'+item.id,{...jbody({enabled:!item.enabled}),method:'PATCH'});await refresh()}
async function refresh(){const [o,p,pr,d]=await Promise.all(['/ontologies','/prompts','/profiles','/documents'].map(x=>api(x)));
selectOptions($('dependencies'),o);selectOptions($('docprofiles'),pr.filter(x=>x.enabled&&o.some(y=>y.id===x.ontology_id&&y.enabled)&&p.some(y=>y.id===x.prompt_id&&y.enabled)));table('ontologylist',['本体','状态','Schema / 警告','操作'],o.map(x=>[x.name,x.enabled?'启用':'停用',details(x.data),button(x.enabled?'停用':'启用',()=>enable('/resources',x))]));
table('promptlist',['提示词','状态','内容','操作'],p.map(x=>[x.name,x.enabled?'启用':'停用',details(x.data),button(x.enabled?'停用':'启用',()=>enable('/resources',x))]));
selectOptions($('profileform').elements.ontology_id,o.filter(x=>x.enabled));selectOptions($('profileform').elements.prompt_id,p.filter(x=>x.enabled));
table('profilelist',['方案','本体','提示词','状态','操作'],pr.map(x=>[x.name,o.find(y=>y.id===x.ontology_id)?.name,p.find(y=>y.id===x.prompt_id)?.name,x.enabled?'启用':'停用',button(x.enabled?'停用':'启用',()=>enable('/profiles',x))]));
table('documentlist',['文档','状态','错误','操作'],d.map(x=>{const buttons=el('div');buttons.append(button('分块及抽取详情',()=>showChunks(x)));if(!['QUEUED','PROCESSING'].includes(x.status)){buttons.append(button('重试失败块',async()=>{await api('/documents/'+x.id+'/retry?mode=failed',{method:'POST'});await refresh()}),button('整篇重新抽取',async()=>{await api('/documents/'+x.id+'/retry?mode=all',{method:'POST'});await refresh()}),button('删除',async()=>{if(confirm('删除文档及其知识证据？')){await api('/documents/'+x.id,{method:'DELETE'});$('detail').replaceChildren();await refresh()}}))}return[x.filename,x.status,x.error||'',buttons]}));
selectOptions($('graphform').elements.document_id,d,'全部');if(current==='graph')await showGraph();}
async function showChunks(doc){const data=await api('/documents/'+doc.id+'/chunks');const area=$('detail');area.replaceChildren(el('h3',doc.filename+' — '+data.length+' 个文本块'));for(const c of data){const d=el('details'),title=el('summary','块 '+(c.chunk.chunk_order_index+1)+' · '+(Array.isArray(c.chunk.heading_path)?c.chunk.heading_path.join(' / '):c.chunk.heading_path||'')+' · '+c.routes.length+' 个命中方案 · '+(c.status||'已处理'));d.append(title,el('pre',c.chunk.content),details(c.routes,'路由原因'),details(c.extractions,'实体、属性、关系及校验错误'),details(c.errors,'任务错误'),details(c.cross_relationships||[],'跨块关系补全'),details(c.cross_errors||[],'跨块补全错误'));if(c.last_retry)d.append(details(c.last_retry,'最近失败重试（保留原结果）'));area.append(d)}}
function graphPath(){const id=$('graphform').elements.document_id.value;return '/export'+(id?'?document_id='+encodeURIComponent(id):'')}
let offset=0,focus='',lastTotal=0,graphPageSize=50;
async function showGraph(){const form=$('graphform').elements,params=new URLSearchParams({offset:String(offset),limit:String(graphPageSize)});for(const k of ['document_id','q','class_uri'])if(form[k].value)params.set(k,form[k].value);if(focus)params.set('focus',focus);
const data=await api('/instances?'+params);lastTotal=data.total;selectOptions(form.class_uri,data.classes.map(id=>({id,name:id})),'全部');
$('prevpage').disabled=offset===0;$('nextpage').disabled=offset+graphPageSize>=lastTotal;
$('graphcount').textContent='共 '+data.total+' 个实体 · 本页 '+data.entities.length+' 个实体 / '+data.relationships.length+' 条页内有向关系'+(focus?' · 邻域模式':'')+'（导出不受分页影响）';
table('entitylist',['实体','类型 URI','属性及来源'],data.entities.map(e=>[e.name,e.class_uri,details(e)]));
table('relationlist',['源实体','关系类型 URI','目标实体','来源'],data.relationships.map(r=>[data.entities.find(e=>e.id===r.source)?.name||r.source,r.predicate_uri,data.entities.find(e=>e.id===r.target)?.name||r.target,details(r.sources)]));
const ns='http://www.w3.org/2000/svg',node=(tag,attrs={})=>{const x=document.createElementNS(ns,tag);for(const [k,v] of Object.entries(attrs))x.setAttribute(k,v);return x;};
const svg=node('svg',{viewBox:'0 0 900 600'}),defs=node('defs'),marker=node('marker',{id:'arrow',viewBox:'0 0 10 10',refX:'9',refY:'5',markerWidth:'5',markerHeight:'5',orient:'auto-start-reverse'});marker.append(node('path',{d:'M0 0 L10 5 L0 10z',fill:'#78909c'}));defs.append(marker);svg.append(defs);
const ents=data.entities,positions=new Map();ents.forEach((e,i)=>{const a=2*Math.PI*i/Math.max(ents.length,1);positions.set(e.id,[450+350*Math.cos(a),300+225*Math.sin(a)])});
const groups=new Map();for(const r of data.relationships){if(!positions.has(r.source)||!positions.has(r.target))continue;const k=[r.source,r.target].sort().join(':');const g=groups.get(k)||[];g.push(r);groups.set(k,g)}
for(const rs of groups.values()){rs.forEach((r,i)=>{const [x,y]=positions.get(r.source),[X,Y]=positions.get(r.target),dx=X-x,dy=Y-y,len=Math.hypot(dx,dy)||1,off=(i-(rs.length-1)/2)*35,cx=(x+X)/2-dy/len*off,cy=(y+Y)/2+dx/len*off;const d=r.source===r.target?'M'+(x+8)+' '+(y-10)+' C'+(x+70)+' '+(y-80)+' '+(x-70)+' '+(y-80)+' '+(x-8)+' '+(y-10):'M'+(x+dx/len*15)+' '+(y+dy/len*15)+' Q'+cx+' '+cy+' '+(X-dx/len*15)+' '+(Y-dy/len*15);const edge=node('path',{d,fill:'none',stroke:'#78909c','marker-end':'url(#arrow)'});edge.append(el('title',r.predicate_uri));svg.append(edge);const t=node('text',{x:cx,y:cy-3,'text-anchor':'middle',fill:'#526777'});t.textContent=r.predicate_uri.split(/[#/]/).pop();svg.append(t)})}
for(const e of ents){const [x,y]=positions.get(e.id),g=node('g',{tabindex:'0',role:'button',style:'cursor:pointer'});g.append(node('circle',{cx:x,cy:y,r:14,fill:'#147d88'}));const t=node('text',{x,y:y+27,'text-anchor':'middle'});t.textContent=e.name.slice(0,24);g.append(t);g.onclick=()=>{$('graphinfo').textContent=JSON.stringify(e,null,2)};g.ondblclick=action(async()=>{focus=e.id;offset=0;$('graphform').elements.q.value='';$('graphform').elements.class_uri.value='';await showGraph()});g.onkeydown=ev=>{if(ev.key==='Enter')g.onclick()};svg.append(g)}$('graphview').replaceChildren(svg);enableViewport(svg);}
$('ontologyform').onsubmit=action(async e=>{const data=new FormData(e.target);data.append('dependency_ids',JSON.stringify([...$('dependencies').selectedOptions].map(o=>o.value)));await api('/ontologies',{method:'POST',body:data});e.target.reset();await refresh()});
$('promptform').onsubmit=action(async e=>{await api('/prompts',{method:'POST',body:new FormData(e.target)});e.target.reset();await refresh()});
$('profileform').onsubmit=action(async e=>{await api('/profiles',jbody(Object.fromEntries(new FormData(e.target))));await refresh()});
function documentPayload(form){const f=new FormData(form),options={parser:f.get('parser'),cross_chunk:f.has('cross_chunk'),strategy:f.get('strategy'),size:Number(f.get('size')),overlap:Number(f.get('overlap')),heading_depth:Number(f.get('heading_depth')),number_base:f.get('number_base')?Number(f.get('number_base')):null};if(options.strategy==='H')options.heading_formats=[...$('headingformats').selectedOptions].map(o=>o.value);const profiles=[...$('docprofiles').selectedOptions].map(o=>o.value);if(profiles.length)options.profile_ids=profiles;const data=new FormData();data.append('file',f.get('file'));data.append('options',JSON.stringify(options));return data;}
$('documentform').onsubmit=action(async e=>{await api('/documents',{method:'POST',body:documentPayload(e.target)});await refresh()});
$('preview').onclick=action(async()=>{if(!$('documentform').reportValidity())return;const p=await api('/documents/preview',{method:'POST',body:documentPayload($('documentform'))});$('detail').replaceChildren(el('h3','分块预览：'+p.count+' 块'));for(const c of p.chunks){const d=el('details');d.append(el('summary','块 '+(c.chunk_order_index+1)+' · '+(c.heading_path||'')+' · '+c.tokens+' tokens'),el('pre',c.content));$('detail').append(d)}});
function enableViewport(svg){let view=[0,0,900,600],drag=null;const draw=()=>svg.setAttribute('viewBox',view.join(' '));svg.style.touchAction='none';svg.addEventListener('wheel',e=>{e.preventDefault();const factor=e.deltaY>0?1.15:0.87;if(view[2]*factor<150||view[2]*factor>3600)return;const rect=svg.getBoundingClientRect(),x=(e.clientX-rect.left)/rect.width,y=(e.clientY-rect.top)/rect.height;view[0]+=view[2]*x*(1-factor);view[1]+=view[3]*y*(1-factor);view[2]*=factor;view[3]*=factor;draw()},{passive:false});
svg.addEventListener('pointerdown',e=>{if(e.target.closest('g'))return;drag=[e.clientX,e.clientY,view[0],view[1]];svg.setPointerCapture(e.pointerId)});svg.addEventListener('pointermove',e=>{if(!drag)return;const rect=svg.getBoundingClientRect();view[0]=drag[2]-(e.clientX-drag[0])*view[2]/rect.width;view[1]=drag[3]-(e.clientY-drag[1])*view[3]/rect.height;draw()});svg.addEventListener('pointerup',()=>drag=null);svg.addEventListener('pointercancel',()=>drag=null);$('resetview').onclick=()=>{view=[0,0,900,600];draw()};}
$('graphform').onsubmit=action(async()=>{offset=0;focus='';await showGraph()});$('prevpage').onclick=action(async()=>{offset=Math.max(0,offset-graphPageSize);await showGraph()});$('nextpage').onclick=action(async()=>{if(offset+graphPageSize<lastTotal){offset+=graphPageSize;await showGraph()}});$('clearfocus').onclick=action(async()=>{focus='';offset=0;await showGraph()});$('refresh').onclick=action(refresh);$('export').onclick=action(async()=>{const data=await api(graphPath()),url=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));const a=el('a');a.href=url;a.download='gptonto.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)});
$('exportttl').onclick=action(async()=>{const headers=new Headers();if($('key').value)headers.set('Authorization','Bearer '+$('key').value);const path=graphPath();const r=await fetch('ontology-api'+path+(path.includes('?')?'&':'?')+'format=ttl',{headers});if(!r.ok)throw Error(await r.text());const url=URL.createObjectURL(await r.blob()),a=el('a');a.href=url;a.download='gptonto.ttl';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)});
refresh().catch(e=>msg(e.message));
</script></body></html>
