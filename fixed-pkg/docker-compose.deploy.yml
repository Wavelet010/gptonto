# LightRAG-EDP ARM 离线部署配置
# ================================================================
# 首次部署: ./deploy-offline.sh
# 代码更新: 改 lightrag/ 下任意文件（含 entrypoint）→ restart 即生效
# 停止:     docker compose -f docker-compose.deploy.yml down
# 清数据:   docker compose -f docker-compose.deploy.yml down -v
# ================================================================

services:
  # ============================================================
  # LightRAG-EDP 主服务
  # 基础镜像含 Python 环境+依赖+前端；源码独立挂载
  # ============================================================
  lightrag:
    image: lightrag-base:latest
    container_name: lightrag-edp
    entrypoint: ["/app/lightrag/docker-entrypoint.sh"]
    ports:
      - "9621:9621"
    volumes:
      - ./data/rag_storage:/app/data/rag_storage
      - ./data/inputs:/app/data/inputs
      - ./data/tiktoken:/app/data/tiktoken    # tiktoken 离线缓存
      - ./lightrag:/app/lightrag:ro          # 源码（只读，更新后重启）
      - ./.env:/app/.env:ro
    environment:
      - HOST=0.0.0.0
      - PORT=9621
      - WORKING_DIR=/app/data/rag_storage
      - INPUT_DIR=/app/data/inputs
      - MILVUS_URI=http://milvus:19530
      - MILVUS_DB_NAME=lightrag
    depends_on:
      milvus:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - lightrag-net

  # ============================================================
  # Milvus 向量数据库 (standalone)
  # ============================================================
  milvus:
    image: milvusdb/milvus:v2.5.9
    container_name: milvus-standalone
    command: ["milvus", "run", "standalone"]
    ports:
      - "19530:19530"
      - "9091:9091"
    volumes:
      - ./data/milvus:/var/lib/milvus
    environment:
      - ETCD_ENDPOINTS=etcd:2379
      - MINIO_ADDRESS=minio:9000
      - MINIO_ACCESS_KEY_ID=minioadmin
      - MINIO_SECRET_ACCESS_KEY=minioadmin
    depends_on:
      etcd:
        condition: service_started
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - lightrag-net

  # ============================================================
  # etcd — Milvus 元数据存储
  # ============================================================
  etcd:
    image: quay.io/coreos/etcd:v3.5.18
    container_name: milvus-etcd
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    volumes:
      - ./data/etcd:/etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - lightrag-net

  # ============================================================
  # MinIO — Milvus 文件存储
  # ============================================================
  minio:
    image: minio/minio:latest
    container_name: milvus-minio
    command: minio server /minio_data --console-address ":9001"
    volumes:
      - ./data/minio:/minio_data
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - lightrag-net

  # ============================================================
  # Attu — Milvus 可视化管理界面
  # ============================================================
  attu:
    image: zilliz/attu:latest
    container_name: attu
    # Workaround: 原 entrypoint 在部分 ARM 系统上 command -v /bin/bash
    # 返回空导致 node 把 bash 当 JS 解析报 Invalid or unexpected token.
    # 显式指定 /bin/sh 绕过 entrypoint 的 buggy 命令检测逻辑.
    entrypoint: ["/bin/sh", "-c"]
    command: ["/app/build/env.sh && node dist/src/app.js"]
    ports:
      - "3000:3000"
    environment:
      - MILVUS_URL=milvus:19530
    depends_on:
      - milvus
    restart: unless-stopped
    networks:
      - lightrag-net

networks:
  lightrag-net:
    driver: bridge
