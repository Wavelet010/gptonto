name: GPTOnto regression
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  extraction:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: fixed-pkg/lightrag
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[api]' pytest pytest-asyncio
      - run: python -m compileall -q lightrag/ontology
      - run: python -m pytest tests/test_gptonto.py -q
      - run: GPTONTO_DB=/tmp/gptonto-ci.sqlite3 python -c 'from lightrag.ontology.app import create_app; app=create_app(); paths=app.openapi()["paths"]; assert "/ontology-api/documents" in paths and "/ontology-api/export" in paths and "/query" not in paths'
      - run: |
          python -c 'from pathlib import Path; s=Path("lightrag/ontology/web.html").read_text(); Path("/tmp/gptonto-ui.js").write_text(s.split("<script>",1)[1].split("</script>",1)[0])'
          node --check /tmp/gptonto-ui.js

  original-graph-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: fixed-pkg/lightrag/lightrag_webui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: fixed-pkg/lightrag/lightrag_webui/package-lock.json
      - run: npm ci --legacy-peer-deps
      - name: Build original LightRAG frontend
        run: npm run build
      - name: Build ontology graph frontend
        run: npm run build -- --mode gptonto
      - name: Verify both output entries
        run: |
          test -s ../lightrag/api/webui/index.html
          test -s ../lightrag/ontology/graph_webui/index.html
      - uses: actions/upload-artifact@v4
        with:
          name: gptonto-graph-webui
          path: fixed-pkg/lightrag/lightrag/ontology/graph_webui/
          if-no-files-found: error
